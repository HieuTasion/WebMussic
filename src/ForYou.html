<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh cho ban | NVNP Music</title>
    <style>
      .for-you-page {
        min-height: 100vh;
        padding: 28px 28px 120px;
        background:
          radial-gradient(
            circle at top left,
            rgba(0, 212, 170, 0.12),
            transparent 24%
          ),
          radial-gradient(
            circle at top right,
            rgba(255, 92, 120, 0.1),
            transparent 22%
          );
      }
      .for-you-shell {
        display: grid;
        gap: 24px;
      }
      .for-you-hero,
      .for-you-panel {
        border: 1px solid rgba(0, 212, 170, 0.14);
        border-radius: 28px;
        background: linear-gradient(
          145deg,
          rgba(17, 24, 39, 0.96),
          rgba(10, 15, 26, 0.92)
        );
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.24);
      }
      .for-you-hero {
        padding: 30px;
        display: block; /* Don gian hoa layout hero */
        gap: 22px;
      }
      .for-you-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(0, 212, 170, 0.12);
        color: #7fffe0;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .for-you-hero h1,
      .for-you-panel h2,
      .for-you-mix-card h3,
      .for-you-song-card h3 {
        color: #f4fbff;
      }
      .for-you-hero h1 {
        margin: 18px 0 14px;
        font-size: clamp(2rem, 4vw, 3.6rem);
        line-height: 1.02;
      }
      .for-you-hero p,
      .for-you-panel p,
      .for-you-meta,
      .for-you-note {
        color: #8ea7c2;
      }
      .for-you-hero-copy p {
        margin: 0;
        max-width: 680px;
        line-height: 1.75;
      }
      .for-you-panel {
        padding: 24px;
        display: grid;
        gap: 18px;
      }
      .for-you-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .for-you-panel-head h2 {
        margin: 0;
        font-size: 1.45rem;
      }
      .for-you-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        color: #cbe2ff;
        font-size: 0.9rem;
      }
      .for-you-song-grid,
      .for-you-mix-grid {
        display: grid;
        gap: 20px;
      }
      .for-you-song-grid {
        grid-template-columns: repeat(
          auto-fill,
          minmax(240px, 1fr)
        ); /* Fix loi layout */
      }
      .for-you-mix-grid {
        grid-template-columns: repeat(
          auto-fill,
          minmax(380px, 1fr)
        ); /* Fix loi layout */
      }
      .for-you-song-card,
      .for-you-mix-card {
        border-radius: 24px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition:
          transform 0.22s ease,
          border-color 0.22s ease,
          box-shadow 0.22s ease;
      }
      .for-you-song-card:hover,
      .for-you-mix-card:hover {
        transform: translateY(-3px);
        border-color: rgba(0, 212, 170, 0.28);
        box-shadow: 0 18px 30px rgba(0, 0, 0, 0.18);
      }
      .for-you-song-card {
        display: grid;
        gap: 14px;
      }
      .for-you-song-cover,
      .for-you-mix-cover {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 20px;
      }
      .for-you-song-card h3,
      .for-you-mix-card h3 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }
      .for-you-song-actions {
        display: flex;
        gap: 10px;
      }
      .for-you-btn {
        border: 1px solid rgba(0, 212, 170, 0.16);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        color: #d9ecff;
        font: inherit;
        cursor: pointer;
        padding: 10px 14px;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          background 0.2s ease,
          color 0.2s ease;
      }
      .for-you-btn:hover {
        transform: translateY(-1px);
        color: #00d4aa;
        border-color: rgba(0, 212, 170, 0.32);
        background: rgba(0, 212, 170, 0.08);
      }
      .for-you-btn.primary {
        background: linear-gradient(135deg, #00d4aa, #16b6a1);
        color: #051018;
        border-color: transparent;
        font-weight: 700;
      }
      .for-you-mix-card {
        display: grid;
        grid-template-columns: 108px minmax(0, 1fr);
        gap: 16px;
        align-items: center;
      }
      .for-you-empty {
        padding: 28px;
        border-radius: 22px;
        text-align: center;
        color: #8ea7c2;
        background: rgba(255, 255, 255, 0.03);
        border: 1px dashed rgba(255, 255, 255, 0.12);
      }
      @media (max-width: 980px) {
        .for-you-hero,
        .for-you-song-grid,
        .for-you-mix-grid {
          grid-template-columns: 1fr;
        }
        .for-you-stat-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 768px) {
        .for-you-page {
          padding: 20px 16px 120px;
        }
        .for-you-hero,
        .for-you-panel {
          border-radius: 24px;
        }
        .for-you-mix-card {
          grid-template-columns: 84px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="for-you-page">
      <div class="for-you-shell">
        <section class="for-you-hero">
          <div class="for-you-hero-copy">
            <span class="for-you-eyebrow">
              <i class="bi bi-stars"></i>
              Danh cho ban
            </span>
            <h1 id="for-you-title">Mix nhac cho gu cua ban</h1>
            <p id="for-you-description">
              Goi y tu dong dua tren nhung gi ban da nghe va yeu thich.
            </p>
          </div>
        </section>
        <section class="for-you-panel">
          <div class="for-you-panel-head">
            <div>
              <h2>Vi ban da nghe gan day</h2>
              <p>Goi y dua tren the loai ban hay cham vao.</p>
            </div>
            <span class="for-you-chip">
              <i class="bi bi-lightning-charge-fill"></i>
              Personal picks
            </span>
          </div>
          <div id="for-you-main-grid" class="for-you-song-grid"></div>
        </section>
        <section class="for-you-panel">
          <div class="for-you-panel-head">
            <div>
              <h2>Mix nhanh cho ban</h2>
              <p>Nhung combo de bam phat ngay khi muon nghe lien mach.</p>
            </div>
            <span class="for-you-chip">
              <i class="bi bi-vinyl-fill"></i>
              Ready to play
            </span>
          </div>
          <div id="for-you-mix-grid" class="for-you-mix-grid"></div>
        </section>
      </div>
    </div>
  </body>
</html>
